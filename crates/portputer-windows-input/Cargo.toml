[package]
name = "portputer-windows-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Optional local Windows secure-desktop input broker (experimental)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portputer-core = { path = "../portputer-core" }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
getrandom = "0.4"
hex = "0.4"
ring = "0.17"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }

[[bin]]
name = "portputer-input-service"
path = "src/main.rs"
